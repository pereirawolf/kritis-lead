# Hängt an jeden veröffentlichten Release die Anhänge: Profilpaket, Betreiberformular und Erprobungsunterlagen.
# Der Release wird von Hand über „Releases → Draft a new release“ mit einem Tag v<Version aus package.json> angelegt;
# passt der Tag nicht zur Version oder entsprechen die gebauten Dateien nicht dem Stand, bricht der Lauf ab.
name: Release-Anhänge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  anhaenge:
    runs-on: ubuntu-latest
    # Schreibrecht nur, um die Dateien an den Release zu hängen
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Gebaute Dateien entsprechen dem Stand
        run: |
          node werkzeuge/bauen/schema-bauen.mjs --pruefen
          node werkzeuge/bauen/faelle-erzeugen.mjs --pruefen
          node werkzeuge/bauen/profil-bauen.mjs --pruefen
          node werkzeuge/bauen/schnittstelle-bauen.mjs --pruefen
          node werkzeuge/bauen/formular-bauen.mjs --pruefen
          node werkzeuge/bauen/erprobung-bauen.mjs --pruefen
      - run: npm run profil:zip
      - name: Anhänge bauen (Tag muss zur Version passen)
        run: npm run release -- --tag "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: gh release upload "$TAG" dist/release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
